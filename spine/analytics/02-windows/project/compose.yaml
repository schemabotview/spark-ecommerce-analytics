# The shop's database: customers and products, loaded from data/raw on first start.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shopwave
      POSTGRES_PASSWORD: shopwave
    ports: ["5432:5432"]
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro
      - ./data/raw:/data:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "shopwave", "-d", "shop"]
      interval: 1s
      retries: 30
