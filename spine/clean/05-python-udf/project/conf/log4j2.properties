# Spark logs everything it does. Its log goes to logs/spark.log, so the terminal
# shows only what our jobs print.
rootLogger.level = info
rootLogger.appenderRef.file.ref = file
appender.file.type = File
appender.file.name = file
appender.file.fileName = logs/spark.log
appender.file.append = false
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = %d{HH:mm:ss} %p %c{1}: %m%n%ex
# PySpark's gateway at the same level as the rest: Spark then skips its
# "Setting default log level" notice.
logger.pyspark.name = org.apache.spark.api.python.PythonGatewayServer
logger.pyspark.level = info
