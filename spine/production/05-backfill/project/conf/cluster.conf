# spark-submit --properties-file conf/cluster.conf: run on the local cluster
spark.master                  spark://127.0.0.1:7077
spark.submit.pyFiles          shopwave.zip
# spark-submit starts the driver's JVM before session.py runs: what the JVM
# needs from its start (the log's config, Delta's classes) is set here
spark.driver.extraJavaOptions -Dlog4j2.configurationFile=conf/log4j2.properties
spark.jars                    jars/delta-spark_2.13-4.4.1.jar,\
                              jars/delta-storage-4.4.1.jar
